<!doctype html>
<html lang="en">
<head>

  <title>César Ramos · Portfolio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Fonts: Geist (sans), Geist Mono fallback to JetBrains Mono, Instrument Serif (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script>
    // Tweak defaults — host can rewrite this block.
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#a39bff",
      "density": "comfy",
      "iconMode": "line",
      "theme": "dark"
    }/*EDITMODE-END*/;
  </script>

  <!-- Data first (plain JS) -->
  <script src="src/data.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Tweaks panel: defines useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakColor, TweakSelect, etc -->
  <script type="text/babel" src="src/tweaks-panel.jsx" data-presets="env,react"></script>

  <!-- Components -->
  <script type="text/babel" src="src/icons.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="src/views.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="src/shell.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="src/overlay.jsx" data-presets="env,react"></script>
  <script type="text/babel" src="src/app.jsx" data-presets="env,react"></script>

  <!-- Boot -->
  <script type="text/babel" data-presets="env,react">
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
